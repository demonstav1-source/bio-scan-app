<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bio-Scan AI v2.0</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #020617;
            --card-bg: rgba(30, 41, 59, 0.4);
            --accent: #DEFF9A;
            --text-main: #F8FAFC;
            --text-dim: #94A3B8;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Urbanist', sans-serif;
            margin: 0; padding: 20px;
            overflow-x: hidden;
        }

        header { margin-bottom: 30px; }
        .logo { font-size: 28px; font-weight: 700; color: var(--accent); letter-spacing: -1px; }
        .logo span { color: #fff; }
        .subtitle { font-size: 14px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 2px; }

        /* Bento Grid Layout */
        #product-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Hero card spans 2 columns */
        .product-card:nth-child(3n+1) { grid-column: span 2; }

        .badge {
            align-self: flex-start;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 12px;
        }
        .badge-green { background: rgba(34, 197, 94, 0.2); color: #4ADE80; }
        .badge-purple { background: rgba(168, 85, 247, 0.2); color: #C084FC; }

        .card-title { font-size: 20px; font-weight: 700; margin-bottom: 5px; color: #fff; }
        .card-desc { font-size: 14px; color: var(--text-dim); margin-bottom: 15px; }

        .price-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: auto;
        }

        .price-item { font-size: 12px; color: var(--text-dim); }
        .price-value { font-size: 16px; font-weight: 600; color: #fff; display: block; }

        .margin-block {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .margin-label { font-size: 12px; color: var(--accent); font-weight: 600; }
        .margin-value { font-size: 18px; font-weight: 700; color: var(--accent); }

        .trend-line { font-size: 12px; color: #4ADE80; margin-top: 8px; }

        /* Loader */
        .loader { text-align: center; padding: 50px; color: var(--accent); font-weight: 600; }
    </style>
</head>
<body>
    <header>
        <div class="logo">BIO-SCAN <span>AI</span></div>
        <div class="subtitle">Autonomous Analytical Matrix</div>
    </header>

    <div id="product-container">
        <div class="loader"><i class="fa-solid fa-circle-notch fa-spin"></i> Синхронизация данных...</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        async function loadData() {
            try {
                // Добавляем timestamp для обхода кеша GitHub
                const response = await fetch('data.json?t=' + new Date().getTime());
                const data = await response.json();
                renderProducts(data);
            } catch (error) {
                document.getElementById('product-container').innerHTML = '<div class="loader">Ошибка загрузки данных. Отправьте нишу боту.</div>';
            }
        }

        function renderProducts(products) {
            const container = document.getElementById('product-container');
            container.innerHTML = '';

            products.forEach(p => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="badge ${p.badge_class || 'badge-purple'}">${p.badge_text}</div>
                    <div class="card-title">${p.title}</div>
                    <div class="card-desc">${p.desc}</div>
                    <div class="price-grid">
                        <div class="price-item">Китай (1688)<span class="price-value">${p.china_price}</span></div>
                        <div class="price-item">Рынок СНГ<span class="price-value">${p.rf_price}</span></div>
                    </div>
                    <div class="margin-block">
                        <div class="margin-label">ОЖИДАЕМЫЙ ПРОФИТ</div>
                        <div class="margin-value">${p.margin}</div>
                    </div>
                    <div class="trend-line"><i class="fa-solid fa-chart-line"></i> ${p.trend}</div>
                `;
                container.appendChild(card);
            });
        }

        loadData();
    </script>
</body>
</html>
