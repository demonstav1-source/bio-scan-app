<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bio-Scan Market Analyzer</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --text-color: #ffffff;
            --card-bg: #161b22;
            --accent-green: #238636;
            --accent-purple: #8957e5;
            --text-muted: #8b949e;
            --border-color: #30363d;
            --danger-color: #E24B4A;
            --warning-color: #dbb32d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            font-size: 18px;
            margin: 0;
            font-weight: 600;
        }

        .close-btn {
            background-color: #21262d;
            border: 1px solid var(--border-color);
            color: #ff4d4f;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        #cards-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .shock-header {
            border-left: 3px solid var(--danger-color);
            padding: 10px 15px;
            background: var(--card-bg);
            border-radius: 0 8px 8px 0;
            margin-bottom: 16px;
        }

        .shock-header h2 {
            font-size: 16px;
            margin: 0;
            font-weight: 600;
        }

        .shock-header p {
            font-size: 12px;
            color: var(--text-muted);
            margin: 4px 0 0 0;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
        }

        .price-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            background-color: #0d1117;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        .price-label {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .price-value {
            font-size: 16px;
            font-weight: bold;
        }

        .section-title {
            font-size: 12px;
            font-weight: bold;
            color: var(--text-muted);
            text-transform: uppercase;
            margin: 16px 0 8px 0;
            letter-spacing: 0.5px;
        }

        .cost-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 13px;
        }

        .cost-name {
            color: var(--text-color);
            padding-right: 10px;
        }

        .cost-value {
            font-weight: 600;
            white-space: nowrap;
        }

        .cost-value.minus {
            color: #ff4d4f;
        }

        .verdict-box {
            padding: 16px;
            border-radius: 8px;
            margin-top: 20px;
            border: 1px solid transparent;
        }

        .verdict-box.red {
            background: rgba(226, 75, 74, 0.15);
            border-color: var(--danger-color);
        }

        .verdict-box.yellow {
            background: rgba(219, 179, 45, 0.15);
            border-color: var(--warning-color);
        }

        .verdict-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .verdict-text {
            font-size: 13px;
            line-height: 1.4;
            color: #e6edf3;
        }

        .cta-btn {
            display: block;
            width: 100%;
            background-color: var(--accent-green);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            text-align: center;
            text-decoration: none;
        }

        .loader {
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            min-height: 200px;
            font-size: 14px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🧬 Bio-Scan Analytics</h1>
        <button id="close-app-btn" class="close-btn">Закрыть</button>
    </div>

    <div id="cards-container">
        <div class="loader">⏳ Инициализация подсистем Шок-Отчёта...</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const closeBtn = document.getElementById('close-app-btn');
        if (closeBtn) {
            closeBtn.addEventListener('click', () => tg.close());
        }

        function getStartParam() {
            const fromTg = tg.initDataUnsafe?.start_param;
            if (fromTg) return fromTg;

            const urlParams = new URLSearchParams(window.location.search);
            const startApp = urlParams.get('startapp') || urlParams.get('tgWebAppStartParam');
            if (startApp) return startApp;

            return null;
        }

        function parseStartParam(param) {
            if (!param) return { filename: 'data.json', expectedTs: null };
            const match = param.match(/^(data_\d+)_ts_(\d+)$/);
            if (match) {
                return {
                    filename: `${match[1]}.json`,
                    expectedTs: parseInt(match[2], 10)
                };
            }
            return { filename: 'data.json', expectedTs: null };
        }

        async function loadMarketData() {
            const startParam = getStartParam();
            const { filename, expectedTs } = parseStartParam(startParam);

            const RETRY_INTERVAL_MS = 2000;
            const MAX_RETRIES = 30;
            let attempt = 0;

            while (attempt < MAX_RETRIES) {
                attempt++;
                try {
                    const url = `${filename}?nocache=${Date.now()}`;
                    const response = await fetch(url, {
                        cache: "no-store",
                        headers: { "Pragma": "no-cache", "Cache-Control": "no-cache" }
                    });

                    if (!response.ok) {
                        showLoader(`⏳ Генерация витрины данных GitHub Pages... (${attempt}/${MAX_RETRIES})`);
                        await sleep(RETRY_INTERVAL_MS);
                        continue;
                    }

                    const data = await response.json();
                    const fileTs = data.timestamp ?? 0;

                    if (!expectedTs || fileTs >= expectedTs) {
                        renderShockReport(data);
                        return;
                    }

                    showLoader(`⏳ Синхронизация расчетов ИИ... (${attempt}/${MAX_RETRIES})`);
                    await sleep(RETRY_INTERVAL_MS);

                } catch (err) {
                    showLoader(`⏳ Подключение к серверу аналитики... (${attempt}/${MAX_RETRIES})`);
                    await sleep(RETRY_INTERVAL_MS);
                }
            }

            showError("⚠️ Превышено время ожидания. Пожалуйста, переоткройте отчет из бота.");
        }

        function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }
        function showLoader(text) { const c = document.getElementById('cards-container'); if (c) c.innerHTML = `<div class="loader">${text}</div>`; }
        function showError(text) { const c = document.getElementById('cards-container'); if (c) c.innerHTML = `<div class="loader" style="color:#ff4d4f;">${text}</div>`; }

        function cleanNumber(str) {
            if (!str) return 0;
            return parseFloat(String(str).replace(/[^\d\.]/g, '')) || 0;
        }

        function renderShockReport(data) {
            const container = document.getElementById('cards-container');
            if (!container) return;

            container.innerHTML = '';

            const products = data.products || [];
            if (products.length === 0) {
                showError("⚠️ Ошибка: Данные продуктов не найдены.");
                return;
            }
            
            // Берем первый (основной) продукт из пула для генерации шок-анализа
            const item = products[0];
            const category = data.category || "Товары народного потребления";

            // Текущий курс для расчетов (если цены в $, переводим косты в $)
            const isUsd = String(item.china_price).includes('$') || String(item.rf_price).includes('$');
            const currencySign = isUsd ? '$' : '₽';

            const priceChina = cleanNumber(item.china_price);
            const priceRf = cleanNumber(item.rf_price);
            const paperMarginProc = cleanNumber(item.margin);

            // Инициализация переменных скрытых костов
            let actualWeight, volumeWeight, freightDiff, nicheCostName, nicheCostValue, customsTax, returnsLoss;

            // ЕСЛИ БЭКЕНД НЕ ПРИСЛАЛ РАСЧЕТЫ — СЧИТАЕМ ИХ НА ЛЕТУ ПО КЛАССИФИКАТОРУ НИШ КЛОДА
            if (item.freight_diff) {
                actualWeight = item.actual_weight || "0.5";
                volumeWeight = item.volume_weight || "1.2";
                freightDiff = item.freight_diff;
                nicheCostName = item.niche_cost_name || "Нишевые издержки";
                nicheCostValue = item.niche_cost_value;
                customsTax = item.customs_tax;
                returnsLoss = item.returns_loss;
            } else {
                // Авто-детект ниши
                const catLower = category.toLowerCase();
                if (catLower.includes('бритва') || catLower.includes('кофеварка') || catLower.includes('техника') || catLower.includes('гаджет')) {
                    // Ниша 1. Гаджеты и электроника
                    actualWeight = "0.4";
                    volumeWeight = "1.8";
                    freightDiff = isUsd ? "4.50" : "410";
                    nicheCostName = "Сертификация EAC и декларация ТР ТС";
                    nicheCostValue = isUsd ? "1.80" : "160";
                    customsTax = isUsd ? "2.40" : "220";
                    returnsLoss = isUsd ? "0.90" : "85";
                } else if (catLower.includes('одежда') || catLower.includes('платье') || catLower.includes('текстиль')) {
                    // Ниша 3. Одежда
                    actualWeight = "0.35";
                    volumeWeight = "0.5";
                    freightDiff = isUsd ? "1.10" : "100";
                    nicheCostName = "Обратная логистика маркетплейса (Возврат 40%)";
                    nicheCostValue = isUsd ? "4.20" : "380";
                    customsTax = isUsd ? "1.60" : "150";
                    returnsLoss = isUsd ? "1.30" : "120";
                } else {
                    // Ниша 2. Товары для дома, кухни (Чайники, лампы и т.д.)
                    actualWeight = "0.8";
                    volumeWeight = "4.2";
                    freightDiff = isUsd ? "6.80" : "620";
                    nicheCostName = "Маркировка «Честный знак» + этикетки РФ";
                    nicheCostValue = isUsd ? "0.45" : "40";
                    customsTax = isUsd ? "2.10" : "190";
                    returnsLoss = isUsd ? "1.20" : "110";
                }
            }

            // Рассчитываем итоговую маржу
            const totalHiddenCosts = cleanNumber(freightDiff) + cleanNumber(nicheCostValue) + cleanNumber(customsTax) + cleanNumber(returnsLoss);
            const grossRevenue = priceRf - priceChina;
            const realMarginRubNum = grossRevenue - totalHiddenCosts;
            
            // Расчет реального процента маржинальности
            const realMarginProcNum = priceRf > 0 ? Math.round((realMarginRubNum / priceRf) * 100) : 0;

            const realMarginRub = `${realMarginRubNum > 0 ? '' : '-'}${currencySign}${Math.abs(realMarginRubNum).toFixed(2)}`;
            const realMarginProc = `${realMarginProcNum}%`;

            // Триггер жесткого вердикта
            const isLoss = realMarginRubNum <= (priceRf * 0.1); // Если маржа меньше 10% или в минусе — врубаем красный
            const verdictClass = isLoss ? 'red' : 'yellow';
            const verdictTitle = isLoss ? '❌ КРИТИЧЕСКИЙ УБЫТОК ИЛИ ОТСУТСТВИЕ СТАБИЛЬНОСТИ' : '⚠️ МАРЖА ПОД УГРОЗОЙ ПЕРВОГО ФОРС-МАЖОРА';
            
            let diagnosticText = "";
            if (realMarginRubNum < 0) {
                diagnosticText = `Вы продаете каждую единицу товара в реальный убыток ${realMarginRub}. Бумажная маржа ${item.margin} — это опасная иллюзия, созданная из-за неучтенного объемного веса груза и пошлин.`;
            } else {
                diagnosticText = `Реальная маржинальность упала до ${realMarginProc} (вместо плановых ${item.margin}). Любое колебание курса валюты на 5% или случайный подъем тарифов логистики Cargo полностью обнулит вашу прибыль.`;
            }

            container.innerHTML = `
                <div class="shock-header">
                    <h2>📦 Ниша: ${category}</h2>
                    <p>Анализ по пулу: ${item.title}</p>
                </div>

                <div class="card">
                    <div class="price-grid">
                        <div class="price-item">
                            <div class="price-label">Закупка фабрика</div>
                            <div class="price-value">${item.china_price}</div>
                        </div>
                        <div class="price-item">
                            <div class="price-label">Продажа розница</div>
                            <div class="price-value">${item.rf_price}</div>
                        </div>
                    </div>

                    <div class="cost-row">
                        <span class="cost-name">Заявленная маржа в каталоге</span>
                        <span class="cost-value" style="color: #3fb950;">${item.margin}</span>
                    </div>

                    <div class="section-title">Где горит прибыль (Скрытые издержки):</div>

                    <div class="cost-row">
                        <span class="cost-name">❶ Коэффициент объемного веса (Факт: ${actualWeight} кг / Тариф: ${volumeWeight} кг)</span>
                        <span class="cost-value minus">-${currencySign}${cleanNumber(freightDiff).toFixed(2)}</span>
                    </div>

                    <div class="cost-row">
                        <span class="cost-name">❷ ${nicheCostName}</span>
                        <span class="cost-value minus">-${currencySign}${cleanNumber(nicheCostValue).toFixed(2)}</span>
                    </div>

                    <div class="cost-row">
                        <span class="cost-name">❸ Таможенная очистка, пошлины + НДС 20%</span>
                        <span class="cost-value minus">-${currencySign}${cleanNumber(customsTax).toFixed(2)}</span>
                    </div>

                    <div class="cost-row">
                        <span class="cost-name">❹ Возвраты покупателей и издержки логистики СНГ</span>
                        <span class="cost-value minus">-${currencySign}${cleanNumber(returnsLoss).toFixed(2)}</span>
                    </div>

                    <div class="section-title">Реальная экономика единицы товара:</div>

                    <div class="cost-row" style="border-bottom: none; padding-bottom: 0;">
                        <span class="cost-name" style="font-weight: bold; text-transform: uppercase;">ЧИСТАЯ МАРЖА ИИ:</span>
                        <span class="cost-value" style="color: ${isLoss ? '#ff4d4f' : '#dbb32d'}; font-size: 17px;">
                            ${realMarginRub} (${realMarginProc})
                        </span>
                    </div>
                </div>

                <div class="verdict-box ${verdictClass}">
                    <div class="verdict-title">${verdictTitle}</div>
                    <div class="verdict-text">${diagnosticText} Тренд по Douyin: ${item.trend || '📈 Стабилен'}. Рекомендуется немедленно пересчитать партию через B2B-систему.</div>
                </div>

                <button class="cta-btn" onclick="tg.close()">Перейти к полной юнит-экономике Bio Scan ↗</button>
            `;
        }

        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(loadMarketData, 100);
        });
    </script>
</body>
</html>
