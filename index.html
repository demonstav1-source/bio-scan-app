<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio-Scan Debug</title>
    <style>
        body { background: #0d1117; color: white; font-family: sans-serif; padding: 20px; }
        .card { background: #161b22; padding: 15px; border-radius: 8px; border: 1px solid #30363d; }
        .error { color: #ff4d4f; }
    </style>
</head>
<body>
    <div id="app">Инициализация...</div>

    <script>
        // Принудительно вызываем функцию сразу
        async function start() {
            const app = document.getElementById('app');
            const params = new URLSearchParams(window.location.search);
            const file = params.get('tgWebAppStartParam') || 'data_8039716884.json';
            
            app.innerHTML = "Загружаю: " + file;

            try {
                const response = await fetch(file + '?t=' + new Date().getTime());
                if (!response.ok) throw new Error("Файл не найден");
                const data = await response.json();
                
                const p = data.products[0];
                app.innerHTML = `
                    <div class="card">
                        <h3>${data.category}</h3>
                        <p>${p.title}</p>
                        <hr>
                        <div style="display:flex; justify-content:space-between">
                            <span>Закупка: ${p.china_price}</span>
                            <span style="color:#3B6D11">Маржа: ${p.margin}</span>
                        </div>
                    </div>
                `;
            } catch (err) {
                app.innerHTML = `<div class="error">ОШИБКА: ${err.message}. Проверь имя файла.</div>`;
            }
        }
        
        // Запуск
        setTimeout(start, 500); 
    </script>
</body>
</html>
