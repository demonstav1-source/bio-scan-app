<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    document.getElementById('close-app-btn').addEventListener('click', () => tg.close());

    // НАДЕЖНОЕ ЧТЕНИЕ: Извлекаем start_param из Telegram API или прямо из URL (резерв)
    function getStartParam() {
        const fromTg = tg.initDataUnsafe?.start_param;
        if (fromTg) {
            console.log(`[Bio-Scan]: start_param получен из Telegram API → "${fromTg}"`);
            return fromTg;
        }

        const urlParam = new URLSearchParams(window.location.search).get('tgWebAppStartParam');
        if (urlParam) {
            console.log(`[Bio-Scan]: start_param получен из URL строки → "${urlParam}"`);
            return urlParam;
        }

        console.warn('[Bio-Scan]: start_param не обнаружен. Будет использован data.json');
        return null;
    }

    // Парсим start_param: формат "data_{user_id}_ts_{timestamp}"
    function parseStartParam(param) {
        if (!param) return { filename: 'data.json', expectedTs: null };

        const match = param.match(/^(data_\d+)_ts_(\d+)$/);
        if (match) {
            return {
                filename:   `${match[1]}.json`,   // data_{user_id}.json
                expectedTs: parseInt(match[2], 10) // timestamp от бота
            };
        }
        
        console.warn(`[Bio-Scan]: Нетипичный формат start_param: "${param}". Резерв → data.json`);
        return { filename: 'data.json', expectedTs: null };
    }

    // Главная функция: запрашивает файл, пока timestamp внутри не обновится
    async function loadMarketData() {
        const startParam = getStartParam();
        const { filename, expectedTs } = parseStartParam(startParam);

        const RETRY_INTERVAL_MS = 2000;   // Пауза между запросами (2 сек)
        const MAX_RETRIES       = 20;     // Ожидаем максимум 40 секунд
        let   attempt           = 0;

        console.log(`[Bio-Scan]: Загрузка файла → ${filename} | Ожидаем ts=${expectedTs ?? 'не задан'}`);
        showLoader("⏳ Синхронизация с сервером матрицы...");

        while (attempt < MAX_RETRIES) {
            attempt++;
            try {
                // Жесткий cache-buster, заставляющий CDN выдать новый файл
                const url = `${filename}?nocache=${Date.now()}`;
                const response = await fetch(url, {
                    cache: "no-store",
                    headers: {
                        "Cache-Control": "no-store, no-cache, must-revalidate, max-age=0",
                        "Pragma": "no-cache",
                        "Expires": "0"
                    }
                });

                if (!response.ok) {
                    console.warn(`[Bio-Scan]: Попытка ${attempt}/${MAX_RETRIES} → Статус HTTP ${response.status}, ждем деплой...`);
                    showLoader(`⏳ Деплой GitHub Pages... (${attempt}/${MAX_RETRIES})`);
                    await sleep(RETRY_INTERVAL_MS);
                    continue;
                }

                const data = await response.json();

                // Если зашли без start_param — рендерим то, что есть в data.json
                if (!expectedTs) {
                    console.log(`[Bio-Scan]: ts не задан, выводим текущие доступные данные`);
                    renderCards(data.products || data);
                    return;
                }

                // Сверяем метку времени внутри JSON с ожидаемой от бота
                const fileTs = data.timestamp ?? 0;
                if (fileTs >= expectedTs) {
                    console.log(`[Bio-Scan]: ✅ Данные полностью актуальны! fileTs=${fileTs}`);
                    renderCards(data.products);
                    return;
                }

                // Файл на сервере все еще старый (CDN/деплой задерживается)
                console.warn(`[Bio-Scan]: Попытка ${attempt}/${MAX_RETRIES} → Файл старый (ts=${fileTs} < ожидаем=${expectedTs}). Ждем...`);
                showLoader(`⏳ Обновление данных матрицы... (${attempt}/${MAX_RETRIES})`);
                await sleep(RETRY_INTERVAL_MS);

            } catch (err) {
                console.error(`[Bio-Scan]: Ошибка fetch на попытке ${attempt}:`, err);
                showLoader(`⏳ Восстановление связи... (${attempt}/${MAX_RETRIES})`);
                await sleep(RETRY_INTERVAL_MS);
            }
        }

        // Превышен лимит ожидания деплоя Гитхаба
        console.error("[Bio-Scan]: Таймаут ожидания обновления GitHub Pages.");
        showError("⚠️ Задержка сервера деплоя. Пожалуйста, переоткройте приложение через 5-10 секунд.");
    }

    // Вспомогательные утилиты
    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    function showLoader(text) {
        document.getElementById('cards-container').innerHTML = `<div class="loader">${text}</div>`;
    }

    function showError(text) {
        document.getElementById('cards-container').innerHTML = `<div class="loader" style="color:#ff4d4f;">${text}</div>`;
    }

    function formatPrice(value) {
        const clean = String(value).replace(/[^0-9.]/g, '');
        return clean ? `~$${clean}` : String(value);
    }

    function formatMargin(value) {
        const clean = String(value).replace(/[^0-9.]/g, '');
        return clean ? `~${clean}%` : String(value);
    }

    function formatTrend(value) {
        let text = String(value).trim();
        text = text.replace(/[📈📊]/g, '').trim(); // Не дублируем иконки тренда
        return `📈 ${text}`;
    }

    function renderCards(products) {
        const container = document.getElementById('cards-container');
        container.innerHTML = '';

        // Страховка от падения скрипта, если products пришел не в виде массива
        if (!products || !Array.isArray(products) || products.length === 0) {
            showError("⚠️ Данные анализа не найдены. Повторите запрос в боте.");
            return;
        }

        products.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            const badgeClass = item.badge_class || 'badge-green';

            card.innerHTML = `
                <div class="badge-container">
                    <span class="${badgeClass}">${item.badge_text}</span>
                </div>
                <h2>${item.title}</h2>
                <div class="desc">${item.desc}</div>
                <div class="price-grid">
                    <div class="price-item">
                        <div class="price-label">Китай (1688)</div>
                        <div class="price-value">${formatPrice(item.china_price)}</div>
                    </div>
                    <div class="price-item">
                        <div class="price-label">Рынок СНГ</div>
                        <div class="price-value">${formatPrice(item.rf_price)}</div>
                    </div>
                </div>
                <div class="profit-row">
                    <div class="profit-label">Ожидаемый профит</div>
                    <div class="profit-value">${formatMargin(item.margin)}</div>
                </div>
                <div class="trend-row">
                    <div class="trend-box">
                        <span>${formatTrend(item.trend)}</span>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    // Даем 100мс на гарантированное заполнение переменных Telegram WebApp
    document.addEventListener("DOMContentLoaded", () => {
        setTimeout(loadMarketData, 100);
    });
</script>
