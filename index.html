<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio-Scan AI</title>
    <style>
        /* Общие стили для темной темы Telegram */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background-color: #0f0f0f; color: #fff; padding: 10px; margin: 0;
            display: flex; flex-direction: column; align-items: center; 
        }
        
        /* Твой "старый" дизайн карточек */
        .card { 
            background-color: #1c1c1c; padding: 15px; border-radius: 16px; 
            margin-bottom: 12px; width: 100%; max-width: 400px; box-sizing: border-box;
        }
        
        .header-text { font-size: 1.1rem; font-weight: 600; margin-bottom: 10px; text-align: center; }
        .data-row { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 0.9rem; }
        .data-value { font-weight: bold; color: #fff; }
        
        /* Кнопка */
        .btn-scan { 
            width: 100%; max-width: 400px; padding: 14px; border: none; border-radius: 14px; 
            background-color: #2481cc; color: white; font-weight: 600; font-size: 1rem;
            cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header-text">BIO-SCAN AI</div>
        <div class="data-row"><span>Статус:</span> <span class="data-value">Онлайн</span></div>
        <div class="data-row"><span>Доступно сканов:</span> <span class="data-value">3 / 3</span></div>
    </div>

    <div class="card">
        <div class="header-text" style="color: #ff4757;">Пептид BPC-157</div>
        <div class="data-row"><span>Закупка (Китай):</span> <span class="data-value">~$2.40</span></div>
        <div class="data-row"><span>Маржа:</span> <span class="data-value">~1480%</span></div>
        <div class="data-row"><span>Тренд Douyin:</span> <span class="data-value" style="color: #2ed573;">Рост +42%</span></div>
    </div>

    <div class="card">
        <div class="header-text" style="color: #70a1ff;">Пептид Epitalon</div>
        <div class="data-row"><span>Закупка (Китай):</span> <span class="data-value">~$3.10</span></div>
        <div class="data-row"><span>Маржа:</span> <span class="data-value">~1350%</span></div>
        <div class="data-row"><span>Тренд Douyin:</span> <span class="data-value" style="color: #2ed573;">Рост +28%</span></div>
    </div>

    <button class="btn-scan" onclick="startScan()">Сканировать новые пептиды</button>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        
        function startScan() {
            const btn = document.querySelector('.btn-scan');
            btn.innerText = 'Сканирование...';
            btn.style.backgroundColor = '#444';
            btn.disabled = true;

            tg.showPopup({
                title: 'Запуск',
                message: 'Анализ трендов 1688 запущен...',
                buttons: [{type: 'ok', text: 'Понял'}]
            });

            setTimeout(() => {
                btn.innerText = 'Сканировать новые пептиды';
                btn.style.backgroundColor = '#2481cc';
                btn.disabled = false;
            }, 3000);
        }
    </script>
</body>
</html>
