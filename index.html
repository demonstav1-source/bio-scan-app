<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio-Scan AI</title>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: white; padding: 20px; }
        .card { background-color: #1e1e1e; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        .btn-scan { 
            width: 100%; padding: 15px; border: none; border-radius: 8px; 
            background-color: #007bff; color: white; font-weight: bold; 
            cursor: pointer; transition: background-color 0.3s;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>BIO-SCAN AI</h2>
        <p>Мониторинг пептидных трендов (Китай/1688)</p>
    </div>

    <div class="card">
        <p>Пептид BPC-157: ~2.40$ / флакон</p>
        <p>Маржа: ~1480%</p>
    </div>

    <button class="btn-scan" onclick="startScan()">Сканировать новые пептиды</button>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        function startScan() {
            const btn = document.querySelector('.btn-scan');
            
            // Меняем вид кнопки
            btn.innerText = 'Сканирование...';
            btn.style.backgroundColor = '#555';

            tg.showPopup({
                title: 'Запуск',
                message: 'Анализ трендов запущен...',
                buttons: [{type: 'ok', text: 'Понял'}]
            });

            // Возврат через 3 секунды
            setTimeout(() => {
                btn.innerText = 'Сканировать новые пептиды';
                btn.style.backgroundColor = '#007bff';
            }, 3000);
        }
    </script>
</body>
</html>
