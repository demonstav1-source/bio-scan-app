<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Bio-Scan Data</title>
    <style>
        body { background: #0d1117; color: white; font-family: sans-serif; padding: 20px; }
        .error { color: #ff4d4f; border: 1px solid #ff4d4f; padding: 15px; border-radius: 8px; }
        .success { color: #3fb950; }
    </style>
</head>
<body>
    <div id="app">Загрузка...</div>

    <script>
        async function loadData() {
            const appDiv = document.getElementById('app');
            // Получаем имя файла из параметров запуска (например, data_12345.json)
            const params = new URLSearchParams(window.location.search);
            const startApp = params.get('tgWebAppStartParam') || 'data_8039716884.json'; // Подставь свой файл для теста
            
            console.log("Попытка загрузки файла:", startApp);

            try {
                const response = await fetch(startApp);
                if (!response.ok) throw new Error(`Файл не найден (код: ${response.status})`);
                
                const data = await response.json();
                appDiv.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                console.log("Данные успешно получены:", data);
            } catch (err) {
                appDiv.innerHTML = `<div class="error">Ошибка: ${err.message}<br>Проверь имя файла в репозитории.</div>`;
                console.error(err);
            }
        }
        loadData();
    </script>
</body>
</html>
