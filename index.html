            background: linear-gradient(180deg, #090d14 0%, #111622 100%);

            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            user-select: none;
            min-height: 100vh;

        .header {
            padding: 24px 20px 12px 20px;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #d1f440; /* Фирменный неоново-зеленый цвет */
            margin: 0 0 6px 0;
        }

        .header p {
            font-size: 11px;
            color: #4a5568;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            margin: 0;
            font-weight: 600;
        }

        /* ОСНОВНОЙ КОНТЕЙНЕР КАРТОЧЕК */
        .container {
            padding: 8px 16px 160px 16px; /* Большой padding-bottom, чтобы кнопка не перекрывала контент */
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* СТИЛЬ КАРТОЧКИ ТОВАРА С ТЕМНЫМ ПОЛУПРОЗРАЧНЫМ ФОНОМ */
        .card {
            background: rgba(14, 20, 32, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
        }

        .badge-container {
            margin-bottom: 16px;
        }

        .badge-green {
            display: inline-block;
            background: rgba(209, 244, 64, 0.08);
            color: #d1f440;
            font-size: 10px;
            font-weight: 800;
            padding: 5px 10px;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-purple {
            display: inline-block;
            background: rgba(162, 89, 255, 0.08);
            color: #a259ff;
            font-size: 10px;
            font-weight: 800;
            padding: 5px 10px;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card h2 {
            font-size: 21px;
            font-weight: 700;
            margin: 0 0 12px 0;
            line-height: 1.4;
            letter-spacing: -0.3px;
        }

        .card .desc {
            font-size: 14px;
            color: #8393a7;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        /* ДАННЫЕ ЦЕН И ЭКОНОМИКИ */
        .price-grid {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .price-item {
            flex: 1;
        }

        .price-label {
            font-size: 10px;
            color: #435066;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 600;
        }

        .price-value {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
        }

        /* СТРОКА ОЖИДАЕМОГО ПРОФИТА С ЛИНИЕЙ НАВЕРХУ */
        .profit-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 14px;
        }

        .profit-label {
            font-size: 12px;
            color: #435066;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .profit-value {
            font-size: 20px;
            font-weight: 800;
            color: #d1f440; /* Неоновый процент */
        }

        /* СТИЛЬНАЯ ПЛАШКА ТРЕНДА И РОСТА ПОД ПРОФИЛЕМ */
        .trend-box {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(82, 196, 26, 0.08);
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 12px;
            color: #52c41a;
            font-weight: 600;
        }

        /* ПЛАВАЮЩАЯ КНОПКА СНИЗУ */
        .fixed-bottom-action {
            position: fixed;
            bottom: 80px; /* Высота над таб-баром */
            left: 0;
            width: 100%;
            padding: 0 16px;
            box-sizing: border-box;
            z-index: 100;
        }

        .action-btn {
            width: 100%;
            background: #ffffff;
            color: #0b0e14;
            border: none;
            padding: 16px 0;
            border-radius: 24px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
            transition: transform 0.1s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .action-btn:active {
            transform: scale(0.97);
        }

        /* НИЖНИЙ НАВИГАЦИОННЫЙ БАР (ТАБ-БАР) */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 64px;
            background: #0e131f;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 99;
            padding-bottom: env(safe-area-inset-bottom); /* Поддержка челок iPhone */
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #404c61;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            gap: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

            color: #ffffff;
        }

        .nav-item svg {
            width: 20px;
            height: 20px;
        }

        .loader {
            text-align: center;
            padding: 60px 20px;
            color: #435066;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Bio-Scan AI</h1>
        <p>Autonomous Analytical Matrix</p>
    </div>

    <div class="container" id="cards-container">
        <div class="loader">Считывание потока данных матрицы...</div>
    </div>

    <div class="fixed-bottom-action">
        <button id="close-app-btn" class="action-btn">
            🧬 Начать новый анализ
        </button>
    </div>

    <div class="bottom-nav">
        <button class="nav-item active">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Дом</span>
        </button>
        <button class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
            <span>Профиль</span>
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // Открываем Mini App во весь экран

        // Закрытие приложения для возврата в бота
        document.getElementById('close-app-btn').addEventListener('click', () => {
            tg.close();
        });

        // Функция Клода: Загружает данные из data.json БЕЗ кэширования
        async function loadMarketData() {
            const url = `data.json?v=${Date.now()}`; // Уровень 1: уникальный хвост-таймстамп

            try {
                const response = await fetch(url, {
                    method: "GET",
                    // Уровень 2: Жесткие заголовки против кэширования на серверах GitHub
                    headers: {
                        "Cache-Control": "no-store, no-cache, must-revalidate, max-age=0",
                        "Pragma": "no-cache",
                        "Expires": "0"
                    },
                    // Уровень 3: Запрет Fetch API брать данные из памяти браузера
                    cache: "no-store"
                });

                if (!response.ok) {
                    throw new Error(`HTTP Error: статус ${response.status}`);
                }

                const products = await response.json();
                console.log(`[Bio-Scan]: Данные успешно обновлены:`, products);
                
                // Передаем массив на генерацию HTML-карточек
                renderCards(products);

            } catch (error) {
                console.error("[Bio-Scan]: Ошибка загрузки data.json →", error);
                const container = document.getElementById('cards-container');
                container.innerHTML = `<div class="loader" style="color: #ff4d4f;">⚠️ Ошибка синхронизации данных. Повторите запрос в боте.</div>`;
            }
        }

        // Хелперы форматирования строк
        function formatCurrency(val) {
            let s = String(val).trim();
            s = s.replace(/[~$%\s]/g, ''); // чистим старые знаки
            return `~$${s}`;
        }

        function formatPercent(val) {
            let s = String(val).trim();
            s = s.replace(/[~$%\s]/g, ''); // чистим старые знаки
            return `~${s}%`;
        }

        // Функция отрисовки интерфейса на основе свежего JSON
        function renderCards(products) {
            const container = document.getElementById('cards-container');
            container.innerHTML = ''; // Стираем лоадер

            products.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                
                const badgeClass = item.badge_class || 'badge-green';

                // Форматируем цены со знаками валюты $ и профит с %
                const chinaPrice = formatCurrency(item.china_price);
                const rfPrice = formatCurrency(item.rf_price);
                const margin = formatPercent(item.margin);

                // Очищаем и красиво собираем текст тренда, добавляя график 📈
                let trendText = item.trend.trim();
                trendText = trendText.replace(/[📈📊]/g, ''); // убираем если были
                trendText = `📈 ${trendText}`;

                card.innerHTML = `
                    <div class="badge-container">
                        <span class="${badgeClass}">${item.badge_text}</span>
                    </div>
                    <h2>${item.title}</h2>
                    <div class="desc">${item.desc}</div>
                    <div class="price-grid">
                        <div class="price-item">
                            <div class="price-label">Китай (1688)</div>
                            <div class="price-value">${chinaPrice}</div>
                        </div>
                        <div class="price-item">
                            <div class="price-label">Рынок СНГ</div>
                            <div class="price-value">${rfPrice}</div>
                        </div>
                    </div>
                    <div class="profit-row">
                        <div class="profit-label">Ожидаемый профит</div>
                        <div class="profit-value">${margin}</div>
                    </div>
                    <div class="trend-row">
                        <div class="trend-box">
                            <span>${trendText}</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Запуск логики при полной инициализации DOM дерева
        document.addEventListener("DOMContentLoaded", () => {
            loadMarketData();
        });
    </script>
</body>

                // Применяем форматирование для соответствия скриншоту №2
                const chinaPrice = formatCurrency(item.china_price);
                const rfPrice = formatCurrency(item.rf_price);
                const margin = formatPercent(item.margin);

                // Если ИИ вернул просто текст тренда, добавляем к нему иконку графика
                let trendText = item.trend;
                if (!trendText.includes('📊') && !trendText.includes('📈')) {
                    trendText = `📊 ${trendText}`;
                }

                card.innerHTML = `
                    <div class="badge-container">
                        <span class="${badgeClass}">${item.badge_text}</span>
                    </div>
                    <h2>${item.title}</h2>
                    <div class="desc">${item.desc}</div>
                    <div class="price-grid">
                        <div class="price-item">
                            <div class="price-label">Китай (1688)</div>
                            <div class="price-value">${chinaPrice}</div>
                        </div>
                        <div class="price-item">
                            <div class="price-label">Рынок СНГ</div>
                            <div class="price-value">${rfPrice}</div>
                        </div>
                    </div>
                    <div class="profit-row">
                        <div class="profit-label">Ожидаемый профит</div>
                        <div class="profit-value">${margin}</div>
                    </div>
                    <div class="trend-row">
                        <div class="trend-box">
                            <span>${trendText}</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadMarketData();
        });
    </script>
</body>
</html>
