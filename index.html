<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bio-Scan AI — Матрица Анализа</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* БАЗОВЫЕ НАСТРОЙКИ СТИЛЯ */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b0e14;
            color: #ffffff;
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            user-select: none;
        }

        /* ШАПКА ПРИЛОЖЕНИЯ */
        .header {
            padding: 24px 16px 12px 16px;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #d1f440; /* Твой фирменный неоново-зеленый цвет */
            margin: 0 0 4px 0;
        }

        .header p {
            font-size: 12px;
            color: #5c6980;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
        }

        /* ОСНОВНОЙ КОНТЕЙНЕР КАРТОЧЕК */
        .container {
            padding: 12px 16px 140px 16px; /* Большой padding-bottom, чтобы кнопка не перекрывала контент */
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* СТИЛЬ КАРТОЧКИ ТОВАРА */
        .card {
            background: #111622;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }

        .badge-container {
            margin-bottom: 12px;
        }

        .badge-green {
            display: inline-block;
            background: rgba(209, 244, 64, 0.1);
            color: #d1f440;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 8px;
            text-transform: uppercase;
        }

        .badge-purple {
            display: inline-block;
            background: rgba(162, 89, 255, 0.1);
            color: #a259ff;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 8px;
            text-transform: uppercase;
        }

        .card h2 {
            font-size: 20px;
            font-weight: 700;
            margin: 0 0 8px 0;
            line-height: 1.3;
        }

        .card .desc {
            font-size: 14px;
            color: #9aa6bc;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        /* ДАННЫЕ ЦЕН И ЭКОНОМИКИ */
        .price-grid {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 12px;
        }

        .price-item {
            flex: 1;
        }

        .price-label {
            font-size: 11px;
            color: #5c6980;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .price-value {
            font-size: 18px;
            font-weight: 700;
        }

        .profit-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 12px;
        }

        .profit-label {
            font-size: 13px;
            color: #5c6980;
            text-transform: uppercase;
            font-weight: 600;
        }

        .profit-value {
            font-size: 20px;
            font-weight: 800;
            color: #d1f440;
        }

        .trend-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #52c41a;
            font-weight: 500;
        }

        /* ИСПРАВЛЕННАЯ ПЛАВАЮЩАЯ КНОПКА СНИЗУ */
        .fixed-bottom-action {
            position: fixed;
            bottom: 75px; /* Высота над таб-баром */
            left: 0;
            width: 100%;
            padding: 0 16px;
            box-sizing: border-box;
            z-index: 100;
        }

        .action-btn {
            width: 100%;
            background: #ffffff;
            color: #0b0e14;
            border: none;
            padding: 15px 0;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            transition: transform 0.1s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .action-btn:active {
            transform: scale(0.97);
        }

        /* НИЖНИЙ НАВИГАЦИОННЫЙ БАР (ТАБ-БАР) */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: #111622;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 99;
            padding-bottom: env(safe-area-inset-bottom); /* Поддержка челок iPhone */
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #5c6980;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
        }

        .nav-item.active {
            color: #ffffff;
        }

        .nav-item svg {
            margin-bottom: 4px;
            width: 22px;
            height: 22px;
        }

        /* ИНДИКАТОР ЗАГРУЗКИ */
        .loader {
            text-align: center;
            padding: 40px;
            color: #5c6980;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Bio-Scan AI</h1>
        <p>Autonomous Analytical Matrix</p>
    </div>

    <div class="container" id="cards-container">
        <div class="loader">Считывание потока данных матрицы...</div>
    </div>

    <div class="fixed-bottom-action">
        <button id="close-app-btn" class="action-btn">
            🧬 Начать новый анализ
        </button>
    </div>

    <div class="bottom-nav">
        <button class="nav-item active">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Дом</span>
        </button>
        <button class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
            <span>Профиль</span>
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // Инициализация на полный экран

        // Закрытие приложения при клике на белую кнопку
        document.getElementById('close-app-btn').addEventListener('click', () => {
            tg.close();
        });

        // Функция для динамического рендеринга карточек из data.json
        async function loadMarketData() {
            const container = document.getElementById('cards-container');
            try {
                // Добавляем кэш-бастер, чтобы данные обновлялись мгновенно
                const response = await fetch(`data.json?t=${Date.now()}`);
                if (!response.ok) throw new Error('Ошибка загрузки data.json');
                
                const products = await response.json();
                container.innerHTML = ''; // Очищаем лоадер

                products.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    // Выбираем цвет бэйджа в зависимости от настроек ИИ
                    const badgeClass = item.badge_class || 'badge-green';

                    card.innerHTML = `
                        <div class="badge-container">
                            <span class="${badgeClass}">${item.badge_text}</span>
                        </div>
                        <h2>${item.title}</h2>
                        <div class="desc">${item.desc}</div>
                        <div class="price-grid">
                            <div class="price-item">
                                <div class="price-label">Китай (1688)</div>
                                <div class="price-value">${item.china_price}</div>
                            </div>
                            <div class="price-item">
                                <div class="price-label">Рынок СНГ</div>
                                <div class="price-value">${item.rf_price}</div>
                            </div>
                        </div>
                        <div class="profit-row">
                            <div class="profit-label">Ожидаемый профит</div>
                            <div class="profit-value">${item.margin}</div>
                        </div>
                        <div class="trend-row">
                            <span>${item.trend}</span>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error(error);
                container.innerHTML = `<div class="loader" style="color: #ff4d4f;">⚠️ Ошибка синхронизации данных. Повторите запрос в боте.</div>`;
            }
        }

        // Запуск парсинга при открытии страницы
        loadMarketData();
    </script>
</body>
</html>
