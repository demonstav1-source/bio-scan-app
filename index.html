<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bio-Scan Market Analyzer</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --text-color: #ffffff;
            --card-bg: #161b22;
            --accent-green: #238636;
            --accent-purple: #8957e5;
            --text-muted: #8b949e;
            --border-color: #30363d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            font-size: 18px;
            margin: 0;
            font-weight: 600;
        }

        .close-btn {
            background-color: #21262d;
            border: 1px solid var(--border-color);
            color: #ff4d4f;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        #cards-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
        }

        /* FLEX-КОНТЕЙНЕР ДЛЯ ИСКЛЮЧЕНИЯ НАЛОЖЕНИЯ ТЕКСТА */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 12px;
        }

        .card-header h2 {
            font-size: 16px;
            margin: 0;
            line-height: 1.3;
            flex: 1; /* Занимает всё доступное пространство справа */
        }

        .badge {
            font-size: 10px;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            white-space: nowrap; /* Запрещает тексту внутри плашки переноситься */
            flex-shrink: 0;      /* Запрещает плашке сжиматься */
        }

        .badge-green { background-color: rgba(35, 134, 54, 0.2); color: #58a6ff; border: 1px solid var(--accent-green); }
        .badge-purple { background-color: rgba(137, 87, 229, 0.2); color: #bc8cff; border: 1px solid var(--accent-purple); }

        .desc {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.4;
            margin-bottom: 16px;
        }

        .price-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            background-color: #0d1117;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .price-label {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .price-value {
            font-size: 15px;
            font-weight: bold;
        }

        .profit-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px dashed var(--border-color);
            padding-top: 12px;
            margin-bottom: 8px;
        }

        .profit-label { font-size: 13px; color: var(--text-muted); }
        .profit-value { font-size: 15px; font-weight: bold; color: #3fb950; }

        .trend-row {
            font-size: 12px;
            color: #dbb32d;
            font-weight: 500;
        }

        .loader {
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            min-height: 200px;
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🧬 Bio-Scan Analytics</h1>
        <button id="close-app-btn" class="close-btn">Закрыть</button>
    </div>

    <div id="cards-container">
        <div class="loader">⏳ Инициализация подсистем WebApp...</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const closeBtn = document.getElementById('close-app-btn');
        if (closeBtn) {
            closeBtn.addEventListener('click', () => tg.close());
        }

        // ПУЛЕНЕПРОБИВАЕМЫЙ СБОР ПАРАМЕТРОВ ИЗ ВСЕХ ИСТОЧНИКОВ ТЕЛЕГРАМА
        function getStartParam() {
            const fromTg = tg.initDataUnsafe?.start_param;
            if (fromTg) return fromTg;

            const urlParams = new URLSearchParams(window.location.search);
            // Проверяем и startapp (как шлёт питон), и tgWebAppStartParam (куда его может перемапить TG)
            const startApp = urlParams.get('startapp') || urlParams.get('tgWebAppStartParam');
            if (startApp) return startApp;

            return null;
        }

        function parseStartParam(param) {
            if (!param) return { filename: 'data.json', expectedTs: null };

            const match = param.match(/^(data_\d+)_ts_(\d+)$/);
            if (match) {
                return {
                    filename:   `${match[1]}.json`,
                    expectedTs: parseInt(match[2], 10)
                };
            }
            return { filename: 'data.json', expectedTs: null };
        }

        async function loadMarketData() {
            const startParam = getStartParam();
            const { filename, expectedTs } = parseStartParam(startParam);

            const RETRY_INTERVAL_MS = 2000;
            const MAX_RETRIES       = 30; // Увеличили до 1 минуты ожидания деплоя Pages
            let   attempt           = 0;

            console.log(`[Bio-Scan]: Запрос к файлу: ${filename} | Ожидаемый ts: ${expectedTs}`);

            while (attempt < MAX_RETRIES) {
                attempt++;
                try {
                    const url = `${filename}?nocache=${Date.now()}`;
                    const response = await fetch(url, {
                        cache: "no-store",
                        headers: { "Pragma": "no-cache", "Cache-Control": "no-cache" }
                    });

                    if (!response.ok) {
                        showLoader(`⏳ Генерация витрины данных GitHub Pages... (${attempt}/${MAX_RETRIES})`);
                        await sleep(RETRY_INTERVAL_MS);
                        continue;
                    }

                    const data = await response.json();

                    if (!expectedTs) {
                        renderCards(data.products || data);
                        return;
                    }

                    const fileTs = data.timestamp ?? 0;
                    // Если таймстамп в файле равен или новее сгенерированного ботом — рендерим!
                    if (fileTs >= expectedTs) {
                        renderCards(data.products || data);
                        return;
                    }

                    showLoader(`⏳ Обновление матричных данных ИИ... (${attempt}/${MAX_RETRIES})`);
                    await sleep(RETRY_INTERVAL_MS);

                } catch (err) {
                    showLoader(`⏳ Подключение к серверу данных... (${attempt}/${MAX_RETRIES})`);
                    await sleep(RETRY_INTERVAL_MS);
                }
            }

            showError("⚠️ Превышено время ожидания деплоя. Пожалуйста, закройте приложение и нажмите кнопку открытия снова.");
        }

        function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }
        function showLoader(text) { const c = document.getElementById('cards-container'); if (c) c.innerHTML = `<div class="loader">${text}</div>`; }
        function showError(text) { const c = document.getElementById('cards-container'); if (c) c.innerHTML = `<div class="loader" style="color:#ff4d4f;">${text}</div>`; }

        function renderCards(products) {
            const container = document.getElementById('cards-container');
            if (!container) return;

            container.innerHTML = '';
            const items = Array.isArray(products) ? products : (products?.products || null);

            if (!items || !Array.isArray(items) || items.length === 0) {
                showError("⚠️ Ошибка структуры данных. Отправьте новый запрос боту.");
                return;
            }

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                const badgeClass = item.badge_class || 'badge-green';

                // Новая безопасная Flexbox-структура шапки карточки
                card.innerHTML = `
                    <div class="card-header">
                        <h2>${item.title || 'Без названия'}</h2>
                        <span class="badge ${badgeClass}">${item.badge_text || 'ТРЕНД'}</span>
                    </div>
                    <div class="desc">${item.desc || 'Анализ подготавливается...'}</div>
                    <div class="price-grid">
                        <div class="price-item">
                            <div class="price-label">Китай (1688)</div>
                            <div class="price-value">${item.china_price || '$0'}</div>
                        </div>
                        <div class="price-item">
                            <div class="price-label">Рынок СНГ</div>
                            <div class="price-value">${item.rf_price || '$0'}</div>
                        </div>
                    </div>
                    <div class="profit-row">
                        <div class="profit-label">Ожидаемый профит</div>
                        <div class="profit-value">${item.margin || '0%'}</div>
                    </div>
                    <div class="trend-row">
                        <span>${item.trend || '📈 Стабильный'}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(loadMarketData, 100);
        });
    </script>
</body>
</html>
