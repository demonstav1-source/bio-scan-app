<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    document.getElementById('close-app-btn').addEventListener('click', () => tg.close());

    // Читаем start_param из двух источников: Telegram API и URL (резерв)
    function getStartParam() {
        // Источник 1: стандартный Telegram WebApp API
        const fromTg = tg.initDataUnsafe?.start_param;
        if (fromTg) {
            console.log(`[Bio-Scan]: start_param из Telegram API → "${fromTg}"`);
            return fromTg;
        }

        // Источник 2: query-параметр в URL (Telegram иногда пишет сюда)
        const urlParam = new URLSearchParams(window.location.search).get('tgWebAppStartParam');
        if (urlParam) {
            console.log(`[Bio-Scan]: start_param из URL → "${urlParam}"`);
            return urlParam;
        }

        console.warn('[Bio-Scan]: start_param не найден ни в Telegram API, ни в URL. Используем data.json');
        return null;
    }

    // Парсим start_param: формат "data_{user_id}_ts_{timestamp}"
    function parseStartParam(param) {
        if (!param) return { filename: 'data.json', expectedTs: null };

        const match = param.match(/^(data_\d+)_ts_(\d+)$/);
        if (match) {
            return {
                filename:   `${match[1]}.json`,
                expectedTs: parseInt(match[2], 10)
            };
        }

        console.warn(`[Bio-Scan]: Нераспознанный формат start_param: "${param}". Резерв → data.json`);
        return { filename: 'data.json', expectedTs: null };
    }

    // Основная функция: ждёт пока GitHub Pages задеплоит свежий файл
    async function loadMarketData() {
        // Читаем параметры только после полной инициализации Telegram WebApp
        const startParam              = getStartParam();
        const { filename, expectedTs } = parseStartParam(startParam);

        const RETRY_INTERVAL_MS = 2000;
        const MAX_RETRIES       = 20;    // максимум ~40 сек ожидания
        let   attempt           = 0;

        console.log(`[Bio-Scan]: Файл → "${filename}" | Ожидаем ts=${expectedTs ?? 'не задан'}`);
        showLoader('⏳ Синхронизация с сервером...');

        while (attempt < MAX_RETRIES) {
            attempt++;

            try {
                // Уникальный URL на каждой попытке — GitHub CDN обязан отдать свежую версию
                const url = `${filename}?nocache=${Date.now()}`;

                const response = await fetch(url, {
                    cache: 'no-store',
                    headers: {
                        'Cache-Control': 'no-store, no-cache, must-revalidate',
                        'Pragma':        'no-cache'
                    }
                });

                // Файл ещё не задеплоен (404) или GitHub лежит (5xx)
                if (!response.ok) {
                    console.warn(`[Bio-Scan]: Попытка ${attempt}/${MAX_RETRIES} → HTTP ${response.status}, повтор...`);
                    showLoader(`⏳ Деплой GitHub Pages... (${attempt}/${MAX_RETRIES})`);
                    await sleep(RETRY_INTERVAL_MS);
                    continue;
                }

                const data = await response.json();

                // start_param не передавался — показываем что есть без проверки ts
                if (!expectedTs) {
                    console.log('[Bio-Scan]: ts не задан → показываем текущие данные');
                    renderCards(data.products ?? data);
                    return;
                }

                // Проверяем: GitHub уже отдаёт новую версию файла?
                const fileTs = data.timestamp ?? 0;
                if (fileTs >= expectedTs) {
                    console.log(`[Bio-Scan]: ✅ Данные актуальны! fileTs=${fileTs} >= expectedTs=${expectedTs}`);
                    renderCards(data.products);
                    return;
                }

                // Timestamp устаревший — CDN ещё держит старую копию
                console.warn(`[Bio-Scan]: Попытка ${attempt}/${MAX_RETRIES} → fileTs=${fileTs} < expectedTs=${expectedTs}, ждём...`);
                showLoader(`⏳ Обновление данных... (${attempt}/${MAX_RETRIES})`);
                await sleep(RETRY_INTERVAL_MS);

            } catch (err) {
                console.error(`[Bio-Scan]: Ошибка fetch на попытке ${attempt}:`, err);
                showLoader(`⏳ Повтор подключения... (${attempt}/${MAX_RETRIES})`);
                await sleep(RETRY_INTERVAL_MS);
            }
        }

        // За 40 секунд GitHub так и не обновился
        console.error('[Bio-Scan]: Превышен лимит ожиданий.');
        showError('⚠️ Задержка сервера. Закройте и откройте приложение повторно.');
    }

    // ─── Вспомогательные утилиты ───────────────────────────────────────────

    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    function showLoader(text) {
        document.getElementById('cards-container').innerHTML =
            `<div class="loader">${text}</div>`;
    }

    function showError(text) {
        document.getElementById('cards-container').innerHTML =
            `<div class="loader" style="color:#ff4d4f;">${text}</div>`;
    }

    function formatPrice(value) {
        const clean = String(value).replace(/[^0-9.]/g, '');
        return clean ? `~$${clean}` : String(value);
    }

    function formatMargin(value) {
        const clean = String(value).replace(/[^0-9.]/g, '');
        return clean ? `~${clean}%` : String(value);
    }

    function formatTrend(value) {
        const text = String(value).trim();
        return text.startsWith('📈') ? text : `📈 ${text}`;
    }

    function renderCards(products) {
        const container = document.getElementById('cards-container');
        container.innerHTML = '';

        if (!Array.isArray(products) || products.length === 0) {
            showError('⚠️ Данные не найдены. Повторите запрос в боте.');
            return;
        }

        products.forEach(item => {
            const card      = document.createElement('div');
            card.className  = 'card';
            const badgeClass = item.badge_class || 'badge-green';

            card.innerHTML = `
                <div class="badge-container">
                    <span class="${badgeClass}">${item.badge_text}</span>
                </div>
                <h2>${item.title}</h2>
                <div class="desc">${item.desc}</div>
                <div class="price-grid">
                    <div class="price-item">
                        <div class="price-label">Китай (1688)</div>
                        <div class="price-value">${formatPrice(item.china_price)}</div>
                    </div>
                    <div class="price-item">
                        <div class="price-label">Рынок СНГ</div>
                        <div class="price-value">${formatPrice(item.rf_price)}</div>
                    </div>
                </div>
                <div class="profit-row">
                    <div class="profit-label">Ожидаемый профит</div>
                    <div class="profit-value">${formatMargin(item.margin)}</div>
                </div>
                <div class="trend-row">
                    <span>${formatTrend(item.trend)}</span>
                </div>
            `;
            container.appendChild(card);
        });
    }

    // Ждём полной инициализации DOM И Telegram WebApp перед стартом
    document.addEventListener('DOMContentLoaded', () => {
        // Небольшой defer гарантирует что tg.initDataUnsafe уже заполнен
        setTimeout(loadMarketData, 100);
    });
</script>
